---
- name: Install required packages
  yum:
    name:
      - git
      - curl
      - unzip
      - jq
    state: present

# -----------------------------
# kubectl (AWS EKS official)
# -----------------------------
- name: Download AWS EKS kubectl
  get_url:
    url: "https://s3.us-west-2.amazonaws.com/amazon-eks/{{ eks_version }}/{{ eks_kubectl_date }}/bin/linux/amd64/kubectl"
    dest: "{{ install_dir }}/kubectl"
    mode: '0755'

- name: Verify kubectl
  command: kubectl version --client --short
  changed_when: false

# -----------------------------
# Helm
# -----------------------------
- name: Download helm
  get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/helm.tar.gz

- name: Extract helm
  unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install helm binary
  copy:
    src: /tmp/linux-amd64/helm
    dest: "{{ install_dir }}/helm"
    mode: '0755'
    remote_src: yes

# -----------------------------
# k9s
# -----------------------------
- name: Download k9s
  get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
    dest: /tmp/k9s.tar.gz

- name: Extract k9s
  unarchive:
    src: /tmp/k9s.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install k9s
  copy:
    src: /tmp/k9s
    dest: "{{ install_dir }}/k9s"
    mode: '0755'
    remote_src: yes

# -----------------------------
# kubectx & kubens
# -----------------------------
- name: Clone kubectx repository
  git:
    repo: https://github.com/ahmetb/kubectx.git
    dest: /opt/kubectx
    update: no

- name: Install kubectx
  file:
    src: /opt/kubectx/kubectx
    dest: "{{ install_dir }}/kubectx"
    state: link

- name: Install kubens
  file:
    src: /opt/kubectx/kubens
    dest: "{{ install_dir }}/kubens"
    state: link
